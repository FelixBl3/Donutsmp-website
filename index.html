<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutSMP Base Building</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border: 2px solid #ff007f; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; }
        input, select, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #ff007f; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff3399; }
        .admin-section { display: none; margin-top: 5px; border-top: 3px dashed #ff007f; padding-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ff007f; padding: 10px; text-align: left; }
        th { background: #ff007f; }
        .login-box { display: none; max-width: 300px; margin: 20px auto; border: 1px solid #444; padding: 15px; border-radius: 5px; background: #1a1a1a; }
    </style>
</head>
<body>

    <h1>🍩 DonutSMP Base Building 🍩</h1>
    <p>Get your ultimate, unraidable custom base today!</p>

    <!-- KUNDEN-BEREICH: BESTELLFORMULAR -->
    <div class="card">
        <h2>Place an Order</h2>
        <form id="orderForm">
            <input type="text" id="customerIGN" placeholder="Your Minecraft Username (IGN)" required>
            <select id="baseTier" required>
                <option value="">-- Choose a Base Tier --</option>
                <option value="Small (10M)">Small Base - 10M</option>
                <option value="VIP (25M)">VIP Base - 25M</option>
                <option value="President (75M)">President Base - 75M</option>
            </select>
            <button type="submit">Submit Order</button>
        </form>
        <p id="orderStatus" style="color: #00ffcc; font-weight: bold;"></p>
    </div>

    <!-- NEU: DEZENTER LOGIN TRIGGER -->
    <p style="margin-top: 100px; color: #444; font-size: 12px; cursor: pointer;" onclick="toggleLoginBox()">🛡️ Admin Portal</p>

    <!-- NEU: FESTES ANMELDEFELD AUF DER SEITE (Umgeht die Browser-Blockade) -->
    <div id="loginBox" class="login-box">
        <h3>Admin Login</h3>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkAdminLogin()">Login</button>
    </div>

    <!-- GEHEIMER ADMIN-BEREICH -->
    <div id="adminArea" class="admin-section">
        <h2>👑 Orders Dashboard (Welcome felixausmuc)</h2>
        <button onclick="loadOrders()" style="background: #00ffcc; color: black; max-width: 200px;">Refresh Orders</button>
        <table>
            <thead>
                <tr>
                    <th>IGN</th>
                    <th>Base Tier</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- Bestellungen werden hier dynamisch geladen -->
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://wglbrhpuhjdpmocjhbiw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Aa3rC9dSOyrBZVkLruydZA_A1rW6yOC";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. BESTELLUNG ABSCHICKEN
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ign = document.getElementById('customerIGN').value;
            const tier = document.getElementById('baseTier').value;

            const { data, error } = await supabase
                .from('bestellungen')
                .insert([{ ign: ign, tier: tier, status: 'Offen' }]);

            if (error) {
                document.getElementById('orderStatus').innerText = "Error submitting order. Try again!";
                console.error(error);
            } else {
                document.getElementById('orderStatus').innerText = "✅ Order submitted successfully! I will contact you ingame.";
                document.getElementById('orderForm').reset();
            }
        });

        // 2. ANMELDEFELD ANZEIGEN / VERBERGEN
        function toggleLoginBox() {
            const box = document.getElementById('loginBox');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        // 3. ADMIN LOGIN PRÜFEN
        function checkAdminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            if (user === "felixausmuc" && pass === "donut123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminArea').style.display = 'block';
                loadOrders();
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("Falscher Username oder Passwort!");
            }
        }

        // 4. BESTELLUNGEN AUS DER DATENBANK LADEN
        async function loadOrders() {
            const { data: bestellungen, error } = await supabase
                .from('bestellungen')
                .select('*');

            if (error) {
                console.error("Error fetching orders:", error);
                return;
            }

            const tableBody = document.getElementById('ordersTableBody');
            tableBody.innerHTML = ""; 

            if (bestellungen) {
                bestellungen.forEach(order => {
                    const row = `<tr>
                        <td><b>${order.ign}</b></td>
                        <td>${order.tier}</td>
                        <td style="color: #00ffcc;">${order.status}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            }
        }
    </script>
</body>
</html>
